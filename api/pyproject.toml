[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curfew-api"
version = "0.0.0"
description = "FastAPI service — curfew-core's HTTP layer"
requires-python = ">=3.13"
dependencies = [
    "curfew",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["curfew_api"]

[tool.uv.sources]
curfew = { workspace = true }
