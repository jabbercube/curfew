[project]
name = "curfew-workspace"
version = "0.0.0"
description = "curfew workspace root — see core/, api/, cli/, agents/sdk-python/ for the deliverables"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "api", "cli", "agents/sdk-python"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["curfew", "curfew_api"]

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
    "api/tests",
    "cli/tests",
    "agents/sdk-python/tests",
]
addopts = "--import-mode=importlib"
